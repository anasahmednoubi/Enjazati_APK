<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوستر تطبيق إنجازاتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #2a1252 0%, #0d0917 75%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .box {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
    p { margin: 0 0 16px; font-size: 14px; color: #d8cef0; }
    img {
      width: 100%;
      height: auto;
      border-radius: 18px;
      display: block;
      margin: 0 auto 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(22, 163, 74, 0.35);
    }
    .meta {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>بوستر إعلان تطبيق إنجازاتي</h1>
    <p>لقطات حقيقية 100% من واجهة التطبيق • خط IBM Plex Sans Arabic</p>
    <img src="/enjazati-poster.png" alt="بوستر تطبيق إنجازاتي" />
    <a class="btn" href="/enjazati-poster.png" download="enjazati-poster.png">
      تحميل البوستر (PNG عالي الجودة)
    </a>
    <div class="meta">1080×1350 • جاهز للنشر في رسائل الواتساب وفيسبوك وإنستغرام</div>
  </div>
</body>
</html>
